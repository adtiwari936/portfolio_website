{% extends 'base.html' %}
{% block content %}
<h2>Rainfall Predictor Demo</h2>
<form method="POST">
    <div class="mb-3">
        <label>Temp (°C):</label>
        <input type="number" name="temp" value="25" class="form-control">
    </div>
    <div class="mb-3">
        <label>Humidity (%):</label>
        <input type="number" name="humidity" value="70" class="form-control">
    </div>
    <button type="submit" class="btn btn-success">Predict</button>
</form>
{% if result %}
    <div class="alert alert-info mt-3">Predicted rainfall: {{ result }} mm</div>
{% endif %}
{% endblock %}
