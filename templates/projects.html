<!DOCTYPE html>
<html>
<head>
    <title>Projects - Aditya Tiwari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- COMPLETE CENTERED NAVBAR  -->
<nav class="navbar navbar-expand-lg navbar-dark glass fixed-top py-2">
    <div class="container-fluid px-0">
        <button class="navbar-toggler ms-auto me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse justify-content-center w-100 px-3" id="navbarNav">
            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item mx-2">
                    <a class="nav-link px-3 py-2 rounded-pill glass-hover {{ 'active' if request.endpoint == 'index' else '' }}" href="/">Home</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link px-3 py-2 rounded-pill glass-hover {{ 'active' if request.endpoint == 'projects' else '' }}" href="/projects">Projects</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link px-3 py-2 rounded-pill glass-hover {{ 'active' if request.endpoint == 'predict' else '' }}" href="/predict">ML Demo</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link px-3 py-2 rounded-pill glass-hover" href="/contact">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>


    <div class="container mt-5">
        <h1 class="mb-4">My Projects</h1>
        {% if projects %}
            <div class="row">
                {% for project in projects %}
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow">
                        <img src="{{ url_for('static', filename='project.jpg') }}" class="card-img-top" alt="{{ project.title }}">
                        <div class="card-body">
                            <h5 class="card-title">{{ project.title }}</h5>
                            <p class="card-text">{{ project.desc }}</p>
                            <p class="text-muted small">{{ project.tech }}</p>
                            {% if project.github %}
                            <a href="{{ project.github }}" class="btn btn-primary">GitHub</a>
                            {% endif %}
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="alert alert-info">
                <h4>No projects yet!</h4>
                <p>Add projects via <code>flask shell</code></p>
            </div>
        {% endif %}
    </div>
</body>
</html>
